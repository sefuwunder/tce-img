name: Build and Publish Bootc Workstation Image

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * *' # Runs automatically every night at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Podman + Buildah
      - name: Install Podman and Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah
          podman --version
          buildah --version

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: Log in to the Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags, labels) for the image
      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      # 5. Build the Bootc Image with Buildah
      #    (note: buildah-build has no `push` input — pushing is step 7)
      - name: Build Container Image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            Containerfile
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      # 6. Validate the image is a bootable bootc container
      - name: Lint bootc image
        run: |
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bootc container lint

      # 7. Tag and push all tags to GHCR
      - name: Push Container Image
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest "$tag"
            podman push "$tag"
          done
