name: Build and Publish Bootc Workstation Image

on:
  push:
    branches:
      - main
    paths:
      - 'Containerfile'
      - '.github/workflows/**'
  schedule:
    - cron: '0 2 * * *' # Runs automatically every night at 2:00 AM UTC
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Podman + Buildah
      - name: Install Podman and Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y podman buildah
          podman --version
          buildah --version

      # 3. Log in to GitHub Container Registry (GHCR)
      - name: Log in to the Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Extract metadata (tags, labels) for the image
      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      # 5. Build the Bootc Image with Buildah
      #    (note: buildah-build has no `push` input — pushing is step 7)
      - name: Build Container Image
        uses: redhat-actions/buildah-build@v2
        with:
          containerfiles: |
            Containerfile
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          oci: true

      # 6. Validate the image is a bootable bootc container
      - name: Lint bootc image
        run: |
          podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bootc container lint

      # 7. Tag and push all tags to GHCR
      #    (meta.outputs.tags is newline-separated — read it line by line;
      #     a `for tag in ${{ ... }}` loop splits on the newline and dies
      #     with a bash syntax error before pushing anything)
      - name: Push Container Image
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            podman tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest "$tag"
            podman push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # Build the bare-metal installer ISO from the just-pushed image.
  # Skipped on the nightly schedule (the ISO only changes when the
  # Containerfile or this workflow does).
  build-iso:
    name: Build Installer ISO
    needs: build-and-push
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # 1. Install Podman (bootc-image-builder runs as a container)
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      # 2. Log in and pull the published image into rootful storage —
      #    the same /var/lib/containers/storage bootc-image-builder
      #    mounts below, so it finds the image locally (no anonymous
      #    pull, which would fail while the package is still private)
      - name: Pull the published image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          sudo podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      # 3. Build the ISO (live environment; install from it with
      #    `sudo bootc install to-disk /dev/sdX`)
      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --pull=newer \
            -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type bootc-installer \
            --installer-payload-ref ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sudo mv output/bootiso/*.iso output/tce-workstation-installer.iso

      # 4. Upload the ISO as a workflow artifact
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: tce-workstation-installer-iso
          path: output/tce-workstation-installer.iso
          if-no-files-found: error
